<!DOCTYPE html>
<!-- lang: indica el idioma principal del contenido del documento. -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
  <h1>Tarea 1.9 - Formularios HTML</h1>

  <!-- form: agrupa controles para enviar sus datos; action: indica la dirección receptora; method: establece cómo se envían los datos. -->
  <form action="index.html" method="get">
    <!-- fieldset: agrupa controles relacionados. -->
    <fieldset>
      <!-- legend: proporciona un título al grupo de controles. -->
      <legend>Datos personales by Pau</legend>

      <!-- label: identifica un control; for: lo asocia con el id indicado. -->
    </fieldset>
  </form>
</body>
</html>
