<!DOCTYPE html>
<!-- lang: indica el idioma principal del contenido del documento. -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
  <h1>Tarea 1.9 - Formularios HTML</h1>

  <!-- form: agrupa controles para enviar sus datos; action: indica la dirección receptora; method: establece cómo se envían los datos. -->
  <form action="index.html" method="get">
    <!-- fieldset: agrupa controles relacionados. -->
    <fieldset>
      <!-- legend: proporciona un título al grupo de controles. -->
      <legend>Datos personales by Pau</legend>

      <!-- label: identifica un control; for: lo asocia con el id indicado. -->
      <label for="nombre">Nombre:</label>
      <!-- input: crea un control de formulario; type: define el tipo de control; id: identifica el control en el documento; name: identifica el dato enviado. -->
      <!-- text: permite introducir una línea de texto. -->
      <!-- placeholder: muestra una sugerencia cuando el campo está vacío; required: exige completar el campo; autofocus: enfoca el campo al cargar la página; size: establece el ancho visible aproximado; maxlength: limita la cantidad de caracteres. -->
      <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required autofocus size="30" maxlength="40">
      <br>

      <label for="contrasena">Contraseña:</label>
      <!-- password: oculta visualmente los caracteres introducidos. -->
      <!-- minlength: establece la cantidad mínima de caracteres. -->
      <input type="password" id="contrasena" name="contrasena" minlength="8">
      <br>

      <label for="correo">Correo electrónico:</label>
      <!-- email: solicita una dirección de correo y permite validar su formato. -->
      <input type="email" id="correo" name="correo" required>
      <br>

      <label for="telefono">Teléfono:</label>
      <!-- tel: solicita un número de teléfono. -->
      <!-- pattern: establece una expresión que debe cumplir el valor. -->
      <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">
      <br>

      <label for="nacimiento">Fecha de nacimiento:</label>
      <!-- date: permite elegir una fecha. -->
      <input type="date" id="nacimiento" name="nacimiento">
      <br>

      <label for="foto">Foto:</label>
      <!-- file: permite seleccionar un archivo local. -->
      <input type="file" id="foto" name="foto">
      <br>

      <label for="curso">Curso:</label>
      <!-- value: establece el valor inicial del control; readonly: impide modificar el valor desde el formulario. -->
      <input type="text" id="curso" name="curso" value="2026-27" readonly>
      <br>

      <label for="centro">Centro:</label>
      <!-- disabled: desactiva el control y hace que no se incluya en el envío del formulario. -->
      <input type="text" id="centro" name="centro" value="IES La Asunción" disabled>
    </fieldset>
    <fieldset>
      <legend>Preferencias</legend>

      <p>Turno:</p>
      <!-- radio: permite escoger una opción de un grupo de opciones excluyentes. -->
      <input type="radio" id="manana" name="turno" value="manana">
      <label for="manana">Mañana</label>
      <input type="radio" id="tarde" name="turno" value="tarde">
      <label for="tarde">Tarde</label>
      <br>

      <p>Intereses:</p>
      <!-- checkbox: permite marcar o desmarcar una opción independiente. -->
      <input type="checkbox" id="programacion" name="intereses" value="programacion">
      <label for="programacion">Programación</label>
      <input type="checkbox" id="diseno" name="intereses" value="diseno">
      <label for="diseno">Diseño</label>
      <input type="checkbox" id="redes" name="intereses" value="redes">
      <label for="redes">Redes</label>
      <br>

      <label for="horas">Horas de estudio:</label>
      <!-- number: permite introducir un valor numérico. -->
      <!-- min: fija el valor mínimo; max: fija el valor máximo; step: establece el incremento permitido. -->
      <input type="number" id="horas" name="horas" min="0" max="10" step="2">
      <br>

      <label for="nivel">Nivel:</label>
      <!-- range: permite elegir un número dentro de un intervalo mediante un deslizador. -->
      <input type="range" id="nivel" name="nivel" min="1" max="10">
      <br>

      <label for="color">Color favorito:</label>
      <!-- color: permite seleccionar un color. -->
      <input type="color" id="color" name="color">
      <br>

      <label for="hora">Hora:</label>
      <!-- time: permite elegir una hora. -->
      <input type="time" id="hora" name="hora">
      <br>

      <label for="semana">Semana:</label>
      <!-- week: permite elegir una semana de un año. -->
      <input type="week" id="semana" name="semana">
      <br>

      <label for="mes">Mes:</label>
      <!-- month: permite elegir un mes y un año. -->
      <input type="month" id="mes" name="mes">
      <br>

    </fieldset>
  </form>
</body>
</html>
